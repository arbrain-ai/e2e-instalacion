# Bienvenida en bucle en Windows (29 oct 2026, un fundador: Windows 11, Node 24.14, v0.2.10). Con la bienvenida ya
# completada, el servidor encendido por la app de escritorio, el arranque automático (VBS) o PowerShell responde
# /api/primer-arranque con falta:true y nombre:null; desde Git Bash con `. ~/.arbrain/entorno.sh` funciona.
# Etapas (cada una deja «ETAPA … BIEN|MAL» en el resumen; bienvenida-diag.mjs):
#   A · Git Bash con entorno.sh (como INSTALAR): arranca, completa la bienvenida por la API real y la lee.
#   B · PowerShell oculto con el entorno de una sesión de Windows (sin HOME de Git Bash, PATH del registro, cwd System32).
#   C · El arranque automático real: `arranque-automatico activar` y wscript sobre el «Arbrain Servidor.vbs» de Inicio.
#   D · La app de escritorio (Arbrain.exe) enciende el servidor (servidor.rs › arrancar).
# Fuente: una etiqueta publicada de arbrain-ai/arbrain (por defecto la del fundador) o una copia de prueba (bundle de un
# release «pre-…» de este repo) para comprobar el arreglo antes de publicar.
name: E2E bienvenida · Windows
on:
  workflow_dispatch:
    inputs:
      etiqueta:
        description: 'Etiqueta publicada de arbrain-ai/arbrain (si no hay bundle)'
        default: 'v0.2.10'
        type: string
      release:
        description: 'Release de prueba de este repo con la copia (vacío = usar la etiqueta)'
        default: ''
        type: string
      asset:
        default: 'copia-bienvenida.bundle'
        type: string
      node:
        default: '24.14'
        type: string
      como_ivan:
        description: 'Perfil «C:\\Users\\Aztec PC» (con espacio) y la copia en D:\\arBrain, como el fundador'
        default: false
        type: boolean
      sin_git:
        description: 'B, C y D sin Git en el PATH de Windows (Git instalado «solo para Git Bash»)'
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  bienvenida:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      ETIQUETA: ${{ inputs.etiqueta }}
      RELEASE: ${{ inputs.release }}
      ASSET: ${{ inputs.asset }}
      SIN_GIT: ${{ inputs.sin_git }}
      COMO_IVAN: ${{ inputs.como_ivan }}
    steps:
      - name: Perfil y carpeta de la copia
        shell: pwsh
        run: |
          if ($env:COMO_IVAN -eq 'true') {
            $p = 'C:\Users\Aztec PC'
            New-Item -ItemType Directory -Force "$p\AppData\Roaming", "$p\AppData\Local" | Out-Null
            "USERPROFILE=$p" >> $env:GITHUB_ENV; "HOME=$p" >> $env:GITHUB_ENV
            "APPDATA=$p\AppData\Roaming" >> $env:GITHUB_ENV; "LOCALAPPDATA=$p\AppData\Local" >> $env:GITHUB_ENV
            "REPO_W=D:\arBrain" >> $env:GITHUB_ENV
          } else { "REPO_W=$env:USERPROFILE\Arbrain" >> $env:GITHUB_ENV }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: e2e

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node }}

      - name: Copia en ~/Arbrain (rama mi-arbrain, ancla de firmas como INSTALAR)
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$RELEASE" ]; then
            cd "$RUNNER_TEMP" && gh release download "$RELEASE" -R "$GITHUB_REPOSITORY" -p "$ASSET" -D .
            git clone -q --origin dani "$ASSET" "$(cygpath -u "$REPO_W")"
          else
            git clone -q --origin dani --branch "$ETIQUETA" https://github.com/arbrain-ai/arbrain.git "$(cygpath -u "$REPO_W")"
          fi
          cd "$(cygpath -u "$REPO_W")"
          echo "HOME=$HOME · USERPROFILE=$USERPROFILE · APPDATA=$APPDATA · copia en $PWD" | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir -p ~/.config/arbrain
          sed -n '/^arbrain-publicacion /p;/^arbrain-reserva /p' INSTALAR.md > ~/.config/arbrain/firmas-permitidas
          git switch -q -c mi-arbrain
          git config --local user.name "Mi Arbrain"; git config --local user.email yo@mi-arbrain.local
          bash arbrain/scripts/instalar/requisitos.sh | tail -1 || true
          echo "Node del sistema: $(node -v) en $(command -v node) · VERSION $(cat VERSION)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "NODE_EXE=$(cygpath -w "$(command -v node)")" >> "$GITHUB_ENV"
          echo "DATOS_W=$APPDATA\\ai.arbrain.servidor" >> "$GITHUB_ENV"

      - name: A · Git Bash con entorno.sh (completa la bienvenida)
        shell: bash
        run: |
          set -uo pipefail
          . ~/.arbrain/entorno.sh
          cd "$(cygpath -u "$REPO_W")/arbrain"
          t0=$(date +%s)
          nohup node scripts/servidor.mjs --sin-navegador > "$RUNNER_TEMP/arranque-A.log" 2>&1 &
          ARRANQUE_LOG="$RUNNER_TEMP/arranque-A.log" PLAZO_S=1200 node "$GITHUB_WORKSPACE/e2e/bienvenida-diag.mjs" A --completar || true
          node scripts/servidor.mjs detener
          for i in $(seq 1 30); do [ -f "$APPDATA/ai.arbrain.servidor/daemon/config/servidor.json" ] || break; sleep 1; done

      - name: B · PowerShell oculto con el entorno de una sesión de Windows
        shell: pwsh
        run: |
          $u = [Environment]::GetEnvironmentVariable('Path','User'); $m = [Environment]::GetEnvironmentVariable('Path','Machine')
          $nodeDir = Split-Path $env:NODE_EXE
          $env:Path = "$nodeDir;$m;$u"
          if ($env:SIN_GIT -eq 'true') { $env:Path = ($env:Path -split ';' | Where-Object { $_ -and $_ -notmatch '\\Git\\' }) -join ';'; "B · git en el PATH: $([bool](Get-Command git -ErrorAction SilentlyContinue))" | Tee-Object -Append -FilePath "$env:RUNNER_TEMP\resultados.txt" }
          Remove-Item Env:HOME -ErrorAction SilentlyContinue
          Get-ChildItem Env: | Where-Object { $_.Name -match '^(MSYS|MSYSTEM|SHELL|TERM|SHLVL|OLDPWD|PWD|EXEPATH|MINGW|ORIGINAL_)' } | ForEach-Object { Remove-Item "Env:$($_.Name)" }
          $t0 = Get-Date
          $script = "$env:REPO_W\arbrain\scripts\servidor.mjs"
          Start-Process -FilePath $env:NODE_EXE -ArgumentList @($script, '--sin-navegador') -WorkingDirectory 'C:\Windows\System32' -WindowStyle Hidden -RedirectStandardOutput "$env:RUNNER_TEMP\arranque-B.log" -RedirectStandardError "$env:RUNNER_TEMP\arranque-B.err"
          $env:ARRANQUE_LOG = "$env:RUNNER_TEMP\arranque-B.err"
          & $env:NODE_EXE "$env:GITHUB_WORKSPACE\e2e\bienvenida-diag.mjs" B
          & $env:NODE_EXE $script detener
          for ($i = 0; $i -lt 30 -and (Test-Path "$env:DATOS_W\daemon\config\servidor.json"); $i++) { Start-Sleep 1 }
          exit 0

      - name: C · Arranque automático real (VBS de Inicio por wscript)
        shell: pwsh
        run: |
          $u = [Environment]::GetEnvironmentVariable('Path','User'); $m = [Environment]::GetEnvironmentVariable('Path','Machine')
          $env:Path = "$m;$u"
          if ($env:SIN_GIT -eq 'true') { $env:Path = ($env:Path -split ';' | Where-Object { $_ -and $_ -notmatch '\\Git\\' }) -join ';' }
          Remove-Item Env:HOME -ErrorAction SilentlyContinue
          $script = "$env:REPO_W\arbrain\scripts\servidor.mjs"
          Set-Location "$env:REPO_W\arbrain"
          & $env:NODE_EXE $script arranque-automatico activar
          $vbs = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup\Arbrain Servidor.vbs"
          Get-Content $vbs | Tee-Object -Append -FilePath "$env:RUNNER_TEMP\resultados.txt"
          Set-Location 'C:\Windows\System32'
          $t0 = Get-Date
          Start-Process wscript.exe -ArgumentList "`"$vbs`""
          & $env:NODE_EXE "$env:GITHUB_WORKSPACE\e2e\bienvenida-diag.mjs" C
          & $env:NODE_EXE $script detener
          & $env:NODE_EXE $script arranque-automatico desactivar
          for ($i = 0; $i -lt 30 -and (Test-Path "$env:DATOS_W\daemon\config\servidor.json"); $i++) { Start-Sleep 1 }
          exit 0

      - name: D · La app de escritorio enciende el servidor
        shell: bash
        run: |
          set -uo pipefail
          . ~/.arbrain/entorno.sh
          cd "$(cygpath -u "$REPO_W")/arbrain"
          node scripts/escritorio.mjs instalar --sin-abrir 2>&1 | tail -3 | tee -a "$RUNNER_TEMP/resultados.txt" || true
          cat ~/.config/arbrain/escritorio.json 2>/dev/null | head -c 600 | tee -a "$RUNNER_TEMP/resultados.txt" || true
          echo
          exe="$LOCALAPPDATA/Programs/Arbrain/Arbrain.exe"
          if [ ! -f "$exe" ]; then echo "D · sin Arbrain.exe" | tee -a "$RUNNER_TEMP/resultados.txt"; exit 0; fi
          t0=$(date +%s)
          powershell.exe -NoProfile -Command "Remove-Item Env:HOME -ErrorAction SilentlyContinue; Start-Process -FilePath '$(cygpath -w "$exe")' -WorkingDirectory 'C:\\Windows\\System32'"
          node "$GITHUB_WORKSPACE/e2e/bienvenida-diag.mjs" D || true
          # Qué muestra la ventana (punto 3: ¿se queda en «Encendiendo tu Arbrain…» con todo en 200?).
          sleep 25; mkdir -p "$RUNNER_TEMP/evidencia"
          powershell -NoProfile -Command "Add-Type -AssemblyName System.Windows.Forms,System.Drawing; \$b=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds; \$i=New-Object System.Drawing.Bitmap \$b.Width,\$b.Height; [System.Drawing.Graphics]::FromImage(\$i).CopyFromScreen(\$b.Location,[System.Drawing.Point]::Empty,\$b.Size); \$i.Save('$(cygpath -w "$RUNNER_TEMP/evidencia/pantalla-D.png")')" || true
          tail -40 "$APPDATA/ai.arbrain.servidor/logs/escritorio.log" 2>/dev/null | sed 's/^/D escritorio.log: /' | tee -a "$RUNNER_TEMP/resultados.txt" || true
          node scripts/servidor.mjs detener
          taskkill //IM Arbrain.exe //F >/dev/null 2>&1 || true

      - name: Resumen
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/evidencia" && cp -r "$RUNNER_TEMP"/resultados.txt "$RUNNER_TEMP"/arranque-* "$APPDATA/ai.arbrain.servidor/logs" "$RUNNER_TEMP/evidencia/" 2>/dev/null || true
          { echo '```'; grep -E '^ETAPA [A-D] (GET|POST|BIEN|MAL|archivo|web|la web)' "$RUNNER_TEMP/resultados.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          ! grep -q '^ETAPA [A-D] MAL' "$RUNNER_TEMP/resultados.txt"

      - name: Evidencia
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bienvenida-windows
          path: ${{ runner.temp }}/evidencia/
          retention-days: 14
