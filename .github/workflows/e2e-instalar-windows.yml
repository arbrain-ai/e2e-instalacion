# Prueba de punta a punta de la instalación de Arbrain en Windows con el prompt REAL (22 oct 2026, encargo de Daniel:
# «una instalación limpia de punta a punta con el prompt real en una VM o runner Windows, cronometrada»).
# Antes de empezar quita Node y Python del sistema (como una PC nueva que solo tiene Git y Claude Code). Claude Code
# piensa con OpenRouter (secreto OPENROUTER_API_KEY) porque un runner no puede iniciar sesión con una suscripción.
name: E2E instalar Arbrain · Windows
on:
  workflow_dispatch:
    inputs:
      prompt:
        default: 'Instala Arbrain siguiendo https://github.com/arbrain-ai/arbrain/blob/main/INSTALAR.md'
        type: string
      respuestas:
        default: 'Respuestas por adelantado (prueba automática sin persona): no tengo carpeta anterior; no quiero respaldo en GitHub; Levy pensará con OpenRouter, así que no inicies sesión de Claude; no actives el arranque automático. Al terminar escribe una línea RESULTADO con la dirección de Arbrain.'
        type: string
      modelo:
        default: 'anthropic/claude-sonnet-5.5'
        type: string
permissions:
  contents: read
jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - name: PC nueva (sin Node ni Python)
        shell: pwsh
        run: |
          foreach ($s in 'Machine','User') {
            $p = [Environment]::GetEnvironmentVariable('Path', $s)
            $n = ($p -split ';' | Where-Object { $_ -and $_ -notmatch 'nodejs|Python|hostedtoolcache|npm|yarn|pnpm' }) -join ';'
            [Environment]::SetEnvironmentVariable('Path', $n, $s)
          }
          Remove-Item -Recurse -Force 'C:\Program Files\nodejs' -ErrorAction SilentlyContinue
      - name: Claude Code (instalador oficial)
        shell: pwsh
        run: irm https://claude.ai/install.ps1 | iex
      - name: El prompt real
        shell: pwsh
        env:
          OR_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PROMPT: ${{ inputs.prompt }}
          RESPUESTAS: ${{ inputs.respuestas }}
          MODELO: ${{ inputs.modelo }}
        run: |
          $env:Path = "C:\Windows\system32;C:\Windows;C:\Windows\System32\WindowsPowerShell\v1.0;C:\Windows\System32\OpenSSH;C:\Program Files\Git\cmd;$env:USERPROFILE\.local\bin;$env:LOCALAPPDATA\Microsoft\WindowsApps"
          if (Get-Command node -ErrorAction SilentlyContinue) { throw "node sigue visible" }
          $env:ANTHROPIC_BASE_URL = 'https://openrouter.ai/api'
          $env:ANTHROPIC_AUTH_TOKEN = $env:OR_KEY
          $env:ANTHROPIC_API_KEY = ''
          $env:ANTHROPIC_MODEL = $env:MODELO
          $env:ANTHROPIC_DEFAULT_SONNET_MODEL = $env:MODELO
          $env:ANTHROPIC_DEFAULT_HAIKU_MODEL = 'anthropic/claude-haiku-5.5'
          $env:CLAUDE_CODE_GIT_BASH_PATH = 'C:\Program Files\Git\bin\bash.exe'
          Set-Location $env:USERPROFILE
          $t0 = Get-Date
          claude -p "$env:PROMPT`n`n$env:RESPUESTAS" --dangerously-skip-permissions --output-format stream-json --verbose > "$env:RUNNER_TEMP\transcript.jsonl"
          $seg = [int]((Get-Date) - $t0).TotalSeconds
          "SEGUNDOS_PROMPT=$seg" | Tee-Object -FilePath "$env:RUNNER_TEMP\tiempo.txt"
          "Prompt real de punta a punta: $seg s" >> $env:GITHUB_STEP_SUMMARY
      - name: Comprobar que Arbrain corre
        if: always()
        shell: bash
        run: |
          . ~/.arbrain/entorno.sh 2>/dev/null || true
          cd ~/Arbrain/arbrain && node scripts/servidor.mjs estado | tee -a "$RUNNER_TEMP/tiempo.txt"
          node scripts/servidor.mjs estado | grep -q Corriendo
          grep -h "no hace falta compilar\|Compilo aquí\|Compilando" "$APPDATA/ai.arbrain.servidor/logs/servidor.log" | tee -a "$RUNNER_TEMP/tiempo.txt" || true
          node -e "const j=require('fs').readFileSync(process.env.RUNNER_TEMP+'/transcript.jsonl','utf8').trim().split('\n').map(l=>{try{return JSON.parse(l)}catch{return null}}).filter(Boolean);const r=j.filter(x=>x.type==='result').pop();console.log('RESULTADO:',r&&r.result&&r.result.slice(-1500));console.log('turnos',r&&r.num_turns,'costo',r&&r.total_cost_usd)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Evidencia
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-windows
          path: |
            ${{ runner.temp }}/transcript.jsonl
            ${{ runner.temp }}/tiempo.txt
          retention-days: 14
